---
site_name: Mujeeb's Online Library
site_url: https://alohamujeeb.github.io/
extra:
  generator: false #Disable footer with "Made with Material for MkDocs" message

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details

  
theme:
  name: material

  palette:
    #scheme: default
    #primary: default
    #accent: default
    
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: default
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    
        
  features:
    - navigation.path
    - navigation.instant
    - navigation.tabs # to display menu in the top bar
    - navigation.tabs.sticky 
    - navigation.footer #next and previous buttons
    - navigation.indexes
    - content.code.copy
    - content.code.select
    - content.code.annotate


plugins: 
  - offline
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      categories_allowed:
        - 5G-Communication
        - Embedded Systems
        - Robotics
        - ROS2
        - Linux
        - Documentation
        - Programming
  - search
  - meta
  - exclude-search:
      exclude:
        - documentation/*
        
        
# Page tree
nav:
  - Home:
    - My Online Library: index.md
    - About Me: about/aboutme.md
    - Whats New: whatsnew.md
    
  - Linux-ROS:
    - Linux 101:
      - CLI Quick Reference: tutorials/linux/linux-cli.md
    - Docker 101:
      - Docker-Installation: tutorials/docker/docker-installation.md
      - Hello-Docker: tutorials/docker/docker-hello.md
      - A More Complex Example: tutorials/docker/tcp-example.md
    - ROS2: tutorials/ros2/ros2.md
    - OpenRMF: tutorials/openrmf/openrmf.md
  
  #- SDN, 
   #- CICD/Devops, 
  #- Infrastructure automation and orchestration
    
   
  - Programming: 
    - Languages: 
      - Golang 101: 
        - Go Programming: languages/golang/index.md
        - 01-Getting Started: languages/golang/01-gettingstarted.md
        - 02-Some Fundamentals: languages/golang/02-basics.md
        - 03-Data Types(1) Numbers and Boolean: languages/golang/03-datatypes-1.md
        - 04-Data Types(2) Strings: languages/golang/04-datatypes-2.md
        - 05-Operators and Typecasting: languages/golang/05-operators.md
        - 06-Conditions and Loops:  languages/golang/06-if-loops.md
        #- 07-Functions: 
        #- imports and packages
        #- Collections 
        
  - Blogs:
    - blog/index.md
  - Keywords: tags.md
 