---
site_name: My Digital Complex
site_url: https://alohamujeeb.github.io/
extra:
  generator: false #Disable footer with "Made with Material for MkDocs" message

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
      
  - admonition
  - pymdownx.details

  
theme:
  name: material
  #custom_dir: docs/overrides

  font:
    #code: Roboto Mono
    #text: Inconsolata
    #text: Anonymous Pro  
    text: Roboto Mono  
    code: Source Code Pro 
    
  palette:
    #scheme: default
    #primary: default
    #accent: default
    
    # Palette toggle for light mode
    - scheme: default
      #primary: indigo
      primary:  blue grey
      accent: red
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      #primary: indigo
      primary: blue grey
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    
        
  features:
    - navigation.tracking
    - navigation.tabs
    #- navigation.tabs.sticky
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs # to display menu in the top bar
    - navigation.tabs.sticky 
    - navigation.footer #next and previous buttons
    - navigation.indexes
    - navigation.sections
    #- navigation.expand
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - header.autohide
    - navigation.prune 
    - navigation.indexes 
    - toc.follow
    #- toc.integrate  #do it at runtime later
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share


plugins: 
  - offline
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      categories_allowed:
        - 5G
        - Embedded Systems
        - Robotics
        - ROS2
        - OpenRMF
        - RMF
        - Linux
        - Programming
        - Life experiences
  - search
  - meta
  - exclude-search:
      exclude:
        - documentation/*
  
        
