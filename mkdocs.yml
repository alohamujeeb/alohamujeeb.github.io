---
site_name: Mujeeb's Online Library
site_url: https://alohamujeeb.github.io/
extra:
  generator: false #Disable footer with "Made with Material for MkDocs" message

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details

  
theme:
  name: material

  palette:
    #scheme: default
    #primary: default
    #accent: default
    
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: default
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    
        
  features:
    - navigation.path
    - navigation.instant
    - navigation.tabs # to display menu in the top bar
    - navigation.tabs.sticky 
    - navigation.footer #next and previous buttons
    - navigation.indexes
    - navigation.sections
    #- navigation.expand
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - header.autohide


plugins: 
  - offline
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true
      categories_allowed:
        - 5G-Communication
        - Embedded Systems
        - Robotics
        - ROS2
        - Linux
        - Documentation
        - Programming
  - search
  - meta
  - exclude-search:
      exclude:
        - documentation/*
  
        
# Page tree
nav:
  - Home:
    - My Online Library: index.md
    - About Me: about/aboutme.md
    - Search:
      - Keywords: tags.md
    - Updates: 
      - Whats New: whatsnew.md
      
  - Linux and Networking:
    - Introduction: linux/introduction.md
    - Linux 101:
      - CLI Quick Reference: linux/linux-cli.md
    - Linux Scripting:
      - Bash Shell: linux/bash-under-construction.md
    - Linux Networking: 
      - Networking Basics: linux/networking-under-construction.md
  #- RoboEmbed
  #- WebCraft  
  - Programming: 
    - Introduction: programing/introduction.md
    - Languages: 
      - Golang 101:
        - Go Programming: programing/languages/golang/index.md
        - 01-Getting Started: programing/languages/golang/01-gettingstarted.md
        - 02-Some Fundamentals: programing/languages/golang/02-basics.md
        - 03-Data Types(1) Numbers and Boolean: programing/languages/golang/03-datatypes-1.md
        - 04-Data Types(2) Strings: programing/languages/golang/04-datatypes-2.md
        - 05-Operators and Typecasting: programing/languages/golang/05-operators.md
        - 06-Conditions and Loops:  programing/languages/golang/06-if-loops.md
        #- 07-Functions: 
        #- imports and packages
        #- Collections 
    - Frameworks:
      - Flask: programming/frameworks/flask-under-construction.md
      - QT: programming/frameworks/qt-under-construction.md
      
  - Software Engineering:  
    - Introduction: sweng/introduction.md  
    - Docker:
        - Docker 101:
          - Docker-Getting Started: sweng/docker/docker-installation.md
          - Hello-Docker: sweng/docker/docker-hello.md
          - A Network Example: sweng/docker/docker-network-example.md
          - A Multi-Client Example: sweng/docker/tcp-example.md
          - Docker Quick Reference: sweng/docker/docker-network-commands.md
   
  - Blogs:
    - blog/index.md
 