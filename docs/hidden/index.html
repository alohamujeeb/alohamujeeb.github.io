<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple WebRTC Shared Text</title>
<style>
  body { font-family: sans-serif; margin: 2em; }
  textarea { width: 100%; height: 300px; font-size: 1.2em; }
</style>
</head>
<body>
<h1>Shared Text via WebRTC</h1>
<textarea id="sharedText" placeholder="Type here..."></textarea>

<script>
(async () => {
  //const signalingServerUrl = 'ws://localhost:8765'; // Replace with your server URL and ws/wss scheme
  const signalingServerUrl = 'ws://157.230.33.15:8765';  //my droplet
  const connection = new WebSocket(signalingServerUrl);

  let pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
  });

  let dataChannel;

  // When data channel is received (for second peer)
  pc.ondatachannel = (event) => {
    dataChannel = event.channel;
    setupDataChannel();
  };

  // Create data channel for the first peer
  function createDataChannel() {
    dataChannel = pc.createDataChannel('text');
    setupDataChannel();
  }

  function setupDataChannel() {
    dataChannel.onopen = () => console.log('Data channel opened');
    dataChannel.onclose = () => console.log('Data channel closed');

    dataChannel.onmessage = (event) => {
      // Update textarea without triggering input event again
      const textarea = document.getElementById('sharedText');
      if (textarea.value !== event.data) {
        textarea.value = event.data;
      }
    };
  }

  // WebSocket signaling
  connection.onopen = () => {
    console.log('Connected to signaling server');

    // Start the negotiation if this is the first connection
    if (pc.connectionState === 'new' || pc.connectionState === 'closed') {
      createDataChannel();
      negotiate();
    }
  };

  connection.onmessage = async (message) => {
    const data = JSON.parse(message.data);

    if (data.sdp) {
      await pc.setRemoteDescription(data.sdp);
      if (data.sdp.type === 'offer') {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        connection.send(JSON.stringify({ sdp: pc.localDescription }));
      }
    } else if (data.ice) {
      try {
        await pc.addIceCandidate(data.ice);
      } catch (e) {
        console.error('Error adding received ice candidate', e);
      }
    }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      connection.send(JSON.stringify({ ice: event.candidate }));
    }
  };

  async function negotiate() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    connection.send(JSON.stringify({ sdp: pc.localDescription }));
  }

  // Textarea input event — send data to the other peer
  document.getElementById('sharedText').addEventListener('input', (e) => {
    if (dataChannel && dataChannel.readyState === 'open') {
      dataChannel.send(e.target.value);
    }
  });
})();
</script>
</body>
</html>
